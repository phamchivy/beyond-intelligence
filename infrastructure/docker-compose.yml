services:
  frontend:
    image: spemmmer/fe-beyond-intelligence:demo-v1.0
    container_name: beyond_frontend
    ports: ["3000:3000"]
    environment:
      - NUXT_PUBLIC_APP_NAME="Beyond Models"
      - NUXT_PUBLIC_APP_DESCRIPTION="AI Short Video Ads Generator"
      - NUXT_PUBLIC_API_BASE="http://backend:8000/api/v1"
      - NUXT_PUBLIC_DEMO_MODE="false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: beyond_backend_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abcdz01234
      POSTGRES_DB: beyond_intelligence
    ports: ["5433:5432"]
    volumes:
      - ../backend/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    image: duytrong298/be-beyond-intelligence:demo-v1.1
    container_name: beyond_backend
    ports: ["8000:8000"]
    environment:
      - AI_SERVICE_URL=http://ai:8001
      - DATA_SERVICE_URL=http://data:8002
      - Services__AgentPodUrl=http://ai:8001
      - Services__DataPodUrl=http://data:8002
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=beyond_intelligence;Username=postgres;Password=abcdz01234
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  ai:
    image: phamchivy/agent-beyond-intelligence:demo-v1.1
    container_name: beyond_agent
    ports: ["8001:8001"]
    env_file:
      - ../agent/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
networks:
  default:
    name: beyond-intelligence-net
