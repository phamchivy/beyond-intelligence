services:
  backend:
    image: duytrong298/be-beyond-intelligence:demo-v1.0
    container_name: beyond_backend
    ports: ["8000:8000"]
    environment:
      - AI_SERVICE_URL=http://ai:8001
      - DATA_SERVICE_URL=http://data:8002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  data:
    build: ../data/image_processor
    container_name: beyond_data
    ports: ["8002:8002"]
    mem_limit: 2g
    environment:
      # No S3_ENDPOINT -- boto3 resolves the real AWS endpoint for
      # S3_REGION. Real S3 bucket "beyond-videos", single-bucket mode
      # (bucket_raw/bucket_processed become key prefixes -- see
      # service/storage.py _physical()). S3_ACCESS_KEY/S3_SECRET_KEY
      # come from infrastructure/.env (gitignored, not committed).
      S3_REGION: ap-southeast-1
      S3_ADDRESSING_STYLE: auto
      S3_BUCKET: beyond-videos
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-only-token-change-me}
    healthcheck:
      # curl isn't in the slim image; the base image already has python.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: beyond-intelligence-net