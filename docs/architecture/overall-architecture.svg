<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="800" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Beyond Intelligence — Overall Architecture</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#6b7280">4 independent pods (FE / BE / AI / DATA) · HTTP only between containers</text>

  <!-- FE -->
  <rect x="400" y="80" width="200" height="55" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="500" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">frontend</text>
  <text x="500" y="121" text-anchor="middle" font-size="11" fill="#4338ca">Nuxt (Vue)</text>

  <!-- BE -->
  <rect x="380" y="190" width="240" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="500" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">backend</text>
  <text x="500" y="230" text-anchor="middle" font-size="11" fill="#1d4ed8">.NET API</text>
  <text x="500" y="246" text-anchor="middle" font-size="10" fill="#1d4ed8">Auth / Orchestrate / Task state</text>

  <!-- App DB -->
  <rect x="430" y="300" width="140" height="55" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="500" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Postgres</text>
  <text x="500" y="338" text-anchor="middle" font-size="10" fill="#4b5563">tasks / state</text>

  <!-- AI agent big box -->
  <rect x="70" y="300" width="330" height="300" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="235" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">ai (agent)</text>
  <text x="235" y="340" text-anchor="middle" font-size="10" fill="#166534">Python — analyze / execute workflow</text>

  <!-- step 1 -->
  <rect x="95" y="352" width="280" height="38" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="235" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">1. Context Builder</text>
  <line x1="235" y1="390" x2="235" y2="400" stroke="#15803d" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="95" y="402" width="280" height="38" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="235" y="426" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">2. Evaluator</text>
  <line x1="235" y1="440" x2="235" y2="450" stroke="#15803d" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="95" y="452" width="280" height="38" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="235" y="476" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">3. Decision Policy → Decision</text>

  <!-- approval gap -->
  <line x1="95" y1="502" x2="375" y2="502" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="235" y="497" text-anchor="middle" font-size="9" fill="#6b7280">Decision sent to BE → FE → user approves</text>
  <line x1="235" y1="502" x2="235" y2="512" stroke="#15803d" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="95" y="514" width="280" height="38" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="235" y="538" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">4. Tool Policy</text>
  <line x1="235" y1="552" x2="235" y2="562" stroke="#15803d" marker-end="url(#arrow)"/>

  <!-- step 5 -->
  <rect x="95" y="564" width="280" height="28" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="235" y="583" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">5. Tool.execute() → Result to BE</text>

  <!-- DATA -->
  <rect x="640" y="300" width="290" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="785" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">data</text>
  <text x="785" y="342" text-anchor="middle" font-size="11" fill="#92400e">FastAPI ingest + query</text>
  <text x="785" y="360" text-anchor="middle" font-size="11" fill="#92400e">Postgres + pgvector store</text>
  <text x="785" y="378" text-anchor="middle" font-size="11" fill="#92400e">daily Kalodata sync job</text>

  <!-- Gemini external -->
  <rect x="60" y="670" width="190" height="55" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="155" y="693" text-anchor="middle" font-size="13" font-weight="700" fill="#4b5563">Gemini API</text>
  <text x="155" y="709" text-anchor="middle" font-size="10" fill="#6b7280">external LLM</text>

  <!-- Kalodata external -->
  <rect x="690" y="500" width="190" height="55" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="785" y="523" text-anchor="middle" font-size="13" font-weight="700" fill="#4b5563">Kalodata API</text>
  <text x="785" y="539" text-anchor="middle" font-size="10" fill="#6b7280">external TikTok data source</text>

  <!-- Arrows: FE -> BE -->
  <line x1="500" y1="135" x2="500" y2="188" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="508" y="165" font-size="10" fill="#374151">REST / SSE</text>

  <!-- BE -> AI -->
  <line x1="400" y1="255" x2="270" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="278" font-size="10" fill="#374151">POST /analyze /execute</text>

  <!-- BE -> App DB -->
  <line x1="500" y1="260" x2="500" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BE -> DATA (optional) -->
  <line x1="600" y1="255" x2="750" y2="298" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDash)"/>
  <text x="605" y="278" font-size="10" fill="#6b7280">optional direct query</text>

  <!-- AI step1 -> DATA -->
  <line x1="375" y1="371" x2="638" y2="345" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="365" font-size="10" fill="#374151">GET policy-rules / channel-history</text>

  <!-- AI step2 -> Gemini -->
  <line x1="155" y1="440" x2="155" y2="668" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDash)"/>
  <text x="90" y="560" font-size="10" fill="#6b7280" transform="rotate(-90 90,560)">LLM call</text>

  <!-- DATA -> Kalodata -->
  <line x1="785" y1="450" x2="785" y2="498" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDash)"/>
  <text x="795" y="478" font-size="10" fill="#6b7280">daily sync</text>

  <!-- Legend -->
  <rect x="60" y="755" width="14" height="14" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="80" y="766" font-size="10" fill="#374151">internal call (required)</text>
  <rect x="260" y="755" width="14" height="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="280" y="766" font-size="10" fill="#6b7280">external / optional call</text>
</svg>
